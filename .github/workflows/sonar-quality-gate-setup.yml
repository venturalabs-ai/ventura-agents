name: Sonar Quality Gate Setup

on:
  workflow_dispatch:
    inputs:
      dry_run_note:
        description: "Optional note (does not change behavior)"
        required: false
        default: "apply Ventura Production gate"
  # Re-apply when the gate policy JSON changes on main
  push:
    branches: [main]
    paths:
      - "sonar/quality-gate.json"
      - "scripts/apply_sonar_quality_gate.py"
      - "scripts/setup-sonar-quality-gate.sh"
      - ".github/workflows/sonar-quality-gate-setup.yml"

permissions:
  contents: read

concurrency:
  group: sonar-qg-setup
  cancel-in-progress: true

jobs:
  apply-quality-gate:
    name: Apply Ventura Production gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is required to create/update Quality Gates."
            echo "Generate a token at https://sonarcloud.io (preferably with Administer Quality Gates)."
            echo "Add it under Settings → Secrets and variables → Actions → SONAR_TOKEN"
            exit 1
          fi

      - name: Apply Quality Gate from sonar/quality-gate.json
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: venturalabs-ai
          SONAR_PROJECT_KEY: venturalabs-ai_ventura-agents
        run: |
          python3 scripts/apply_sonar_quality_gate.py

      - name: Summary
        run: |
          echo "### Quality Gate applied" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate: **Ventura Production**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`sonar/quality-gate.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`venturalabs-ai_ventura-agents\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI: https://sonarcloud.io/organizations/venturalabs-ai/quality_gates" >> "$GITHUB_STEP_SUMMARY"
