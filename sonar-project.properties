sonar.projectKey=venturalabs-ai_ventura-agents
sonar.organization=venturalabs-ai
sonar.projectName=Ventura Agents Ecosystem
sonar.projectVersion=3.0.0

# Sources
sonar.sources=src,agents,core
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/package-lock.json,docs/**,*.md
sonar.test.exclusions=**/node_modules/**,**/dist/**

# Coverage (when available)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Language-specific
sonar.typescript.tsconfigPath=tsconfig.json
sonar.python.version=3.12
