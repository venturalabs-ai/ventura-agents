sonar.projectKey=venturalabs-ai_ventura-agents
sonar.organization=venturalabs-ai
sonar.projectName=Ventura Agents Ecosystem
sonar.projectVersion=3.0.0

# SCM
sonar.scm.provider=git

# Quality Gate — wait for result when supported by scanner/CI
sonar.qualitygate.wait=true

# Sources (TypeScript platform + Python agents foundation)
sonar.sources=src,agents,core
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/package-lock.json,\
  docs/**,\
  scripts/**,\
  ops/**,\
  sonar/**,\
  **/*.md

sonar.test.inclusions=tests/**/*.ts,tests/**/*.py,tests/**/*.test.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**

# Coverage reports (generated in CI when available)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Language
sonar.typescript.tsconfigPath=tsconfig.json
sonar.python.version=3.12

# Quality / noise reduction
sonar.cpd.exclusions=**/*.test.ts,**/tests/**
